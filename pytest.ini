[pytest]
testpaths = tests
pythonpath = .
addopts = -v --strict-markers --html=reports/report.html --self-contained-html
markers =
    schema: structural / DDL validation
    completeness: row-count and coverage checks
    accuracy: column-level transformation checks
    integrity: keys, constraints, orphans
    reconciliation: aggregate and checksum reconciliation
    rejects: data-quality reject handling
    smoke: quick post-migration sanity
